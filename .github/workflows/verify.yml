name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install --requirement server/requirements.txt

      - name: Verify frontend
        run: npm run check && npm test && npm run build && npm run smoke

      - name: Verify FastAPI service
        env:
          PYTHONPATH: .
          HEATSHIFT_DB_PATH: ${{ runner.temp }}/heatshift.sqlite3
        run: python -m pytest server/tests -q

      - name: Start API and exercise live contract
        env:
          PYTHONPATH: .
          HEATSHIFT_DB_PATH: ${{ runner.temp }}/heatshift-live.sqlite3
          HEATSHIFT_CORS_ORIGINS: http://127.0.0.1:4173
        run: |
          python -m uvicorn server.app:app --host 127.0.0.1 --port 8000 > "${{ runner.temp }}/heatshift-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat "${{ runner.temp }}/heatshift-api.log"
              exit 1
            fi
            sleep 1
          done
          response=$(curl --fail --silent --X POST http://127.0.0.1:8000/api/v1/plans             -H 'Content-Type: application/json'             --data '{"shiftName":"CI smoke","startTime":"12:00","duration":4,"temperature":34,"humidity":68,"intensity":"moderate","sun":"direct","ppe":"standard","acclimatized":false}')
          RESPONSE="$response" python -c 'import json, os; data=json.loads(os.environ["RESPONSE"]); assert data["plan"]["shiftName"] == "CI smoke"; assert data["expiresAt"] > data["createdAt"]; print(data["shareToken"])' > "${{ runner.temp }}/heatshift-token"
          curl --fail --silent "http://127.0.0.1:8000/api/v1/plans/$(cat "${{ runner.temp }}/heatshift-token")" > /dev/null

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan tracked files for common secrets
        run: |
          if git grep -n -E '\\b(AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{16,})'; then
            echo "Potential secret detected in tracked files"
            exit 1
          fi
