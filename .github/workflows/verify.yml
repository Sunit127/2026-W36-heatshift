name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --requirement server/requirements.txt

      - name: Verify frontend
        run: npm run check && npm test && npm run build && npm run smoke

      - name: Verify FastAPI service
        env:
          PYTHONPATH: .
          HEATSHIFT_DB_PATH: ${{ runner.temp }}/heatshift.sqlite3
        run: |
          python -m compileall -q server
          python -m pytest server/tests -q
          python -m pip check

      - name: Start API and exercise live contract
        env:
          PYTHONPATH: .
          HEATSHIFT_DB_PATH: ${{ runner.temp }}/heatshift-live.sqlite3
          HEATSHIFT_CORS_ORIGINS: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          python -m uvicorn server.app:app --host 127.0.0.1 --port 8000 > "${{ runner.temp }}/heatshift-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat "${{ runner.temp }}/heatshift-api.log"
              exit 1
            fi
            sleep 1
          done
          response=$(curl --fail --silent --request POST http://127.0.0.1:8000/api/v1/plans \
            -H 'Content-Type: application/json' \
            --data '{"shiftName":"CI smoke","startTime":"12:00","duration":4,"temperature":34,"humidity":68,"intensity":"moderate","sun":"direct","ppe":"standard","acclimatized":false}')
          RESPONSE="$response" python -c 'import json, os; data=json.loads(os.environ["RESPONSE"]); assert data["plan"]["shiftName"] == "CI smoke"; assert data["expiresAt"] > data["createdAt"]; print(data["shareToken"])' > "${{ runner.temp }}/heatshift-token"
          curl --fail --silent "http://127.0.0.1:8000/api/v1/plans/$(cat "${{ runner.temp }}/heatshift-token")" > /dev/null

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan tracked files for common secrets
        shell: bash
        run: |
          if git grep -IEn \
            -e 'AKI[A][0-9A-Z]{16}' \
            -e 'BEGI[N] (RSA|EC|OPENSSH|PGP) PRIVATE KEY' \
            -e 'gh[p]_[A-Za-z0-9]{20,}' \
            -e 'github_pa[t]_[A-Za-z0-9_]{30,}' \
            -e 's[k]-[A-Za-z0-9]{16,}' \
            -- ':!.github/workflows/verify.yml'
          then
            echo "::error::Potential secret pattern found in tracked application files"
            exit 1
          fi
